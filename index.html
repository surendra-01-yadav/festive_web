<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111315">
    <title>VIBRANCE 2027 | Premium Event Experience</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#111315',
                        secondary: '#191D1B',
                        card: '#1C211E',
                        forest: { DEFAULT: '#173F2A', hover: '#0D291C', light: '#23593D' },
                        crimson: { DEFAULT: '#DC2638', deep: '#941B2B' },
                        text: { main: '#F4F3EE', sec: '#A4AAA5' },
                        border: '#303633'
                    },
                    fontFamily: {
                        display: ['Syncopate', 'sans-serif'],
                        body: ['Space Grotesk', 'sans-serif']
                    },
                    transitionTimingFunction: {
                        'cinema': 'cubic-bezier(0.16, 1, 0.3, 1)'
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <style>
        body { 
            background-color: #111315; 
            color: #F4F3EE; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #303633; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #173F2A; }
        @media (max-width: 768px) {
            ::-webkit-scrollbar { display: none; }
            .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        }

        /* Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-entrance { opacity: 0; animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            pointer-events: none; z-index: 10; opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Cinematic Intro Sequence */
        #cinematic-intro { transition: opacity 0.8s ease-out; }
        .scene { opacity: 0; pointer-events: none; transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .scene.active { opacity: 1; pointer-events: auto; }
        .scene-bg-zoom { animation: slowZoom 6s linear forwards; }
        @keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.15); } }
        .clip-reveal { clip-path: polygon(0 50%, 100% 50%, 100% 50%, 0 50%); transition: clip-path 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .active .clip-reveal { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        .letter-track { letter-spacing: 0em; transition: letter-spacing 1.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .active .letter-track { letter-spacing: 0.10em; }
        @media (min-width: 768px) { .active .letter-track { letter-spacing: 0.15em; } }

        /* UI Interactions */
        input, select, textarea { font-size: 16px !important; } 
        @media (min-width: 768px) { input, select, textarea { font-size: 14px !important; } }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #173F2A; box-shadow: 0 0 0 1px #173F2A; }
        
        .upload-zone { border: 2px dashed #303633; transition: all 0.3s ease; }
        .upload-zone.dragover { border-color: #173F2A; background-color: rgba(23, 63, 42, 0.1); transform: scale(1.02); }
        
        .cinematic-card { transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease; }
        @media (hover: hover) and (pointer: fine) {
            .cinematic-card:hover { transform: translateY(-6px); border-color: #173F2A; box-shadow: 0 20px 40px -10px rgba(23, 63, 42, 0.5); }
            .cinematic-card:hover .cinematic-img { transform: scale(1.08); filter: brightness(1.1); }
        }
        .cinematic-img { transition: transform 0.65s ease; filter: brightness(0.9); }

        /* Mobile Modals */
        .modal-enter { animation: modalInDesktop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @media (max-width: 768px) { .modal-enter { animation: modalInMobile 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; } }
        @keyframes modalInDesktop { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes modalInMobile { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body class="font-body overflow-x-hidden flex flex-col h-[100dvh]">

    <div class="noise-overlay"></div>

    <!-- Cinematic 10-Second Intro -->
    <div id="cinematic-intro" class="fixed inset-0 z-[999] bg-primary hidden h-[100dvh]">
        <!-- Scene 1: The Awakening (0-2s) -->
        <div class="scene p-4" id="scene-1">
            <div class="absolute w-48 md:w-64 h-48 md:h-64 bg-crimson/10 rounded-full blur-[80px] md:blur-[100px] animate-pulse"></div>
            <h2 class="font-display text-text-sec text-xs md:text-xl tracking-[0.2em] md:tracking-[0.3em] letter-track text-center leading-relaxed">THE CAMPUS IS ABOUT TO COME ALIVE.</h2>
        </div>
        <!-- Scene 2: The Identity (2-4s) -->
        <div class="scene" id="scene-2">
            <div class="absolute w-64 md:w-96 h-64 md:h-96 bg-forest/20 rounded-full blur-[100px] md:blur-[120px] animate-pulse"></div>
            <h1 class="font-display text-4xl md:text-8xl font-bold tracking-[0.1em] md:tracking-[0.2em] text-white clip-reveal text-center">VIB<span class="text-forest">27</span></h1>
        </div>
        <!-- Scene 3: The Glimpse (4-6s) -->
        <div class="scene" id="scene-3">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-1 md:gap-2 w-full h-full p-2 md:p-10 opacity-60">
                <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=800&q=80" class="w-full h-full object-cover rounded scene-bg-zoom filter grayscale contrast-125">
                <img src="https://images.unsplash.com/photo-1547153760-18fc86324498?w=800&q=80" class="w-full h-full object-cover rounded scene-bg-zoom filter grayscale contrast-125" style="animation-delay: 0.2s">
                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80" class="w-full h-full object-cover rounded scene-bg-zoom filter grayscale contrast-125 hidden md:block" style="animation-delay: 0.4s">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&q=80" class="w-full h-full object-cover rounded scene-bg-zoom filter grayscale contrast-125 hidden md:block" style="animation-delay: 0.6s">
            </div>
            <div class="absolute inset-0 bg-primary/70 flex items-center justify-center p-4">
                <h2 class="font-display text-2xl md:text-5xl font-bold tracking-widest text-white animate-pulse-slow text-center">THE EXPERIENCE AWAITS</h2>
            </div>
        </div>
        <!-- Scene 4: The Experience (6-8s) -->
        <div class="scene" id="scene-4">
            <div class="flex flex-col items-center gap-4 md:gap-6 text-center">
                <span class="font-display text-2xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-forest to-white clip-reveal" style="transition-delay: 0s">INNOVATION.</span>
                <span class="font-display text-2xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-white to-crimson clip-reveal" style="transition-delay: 0.2s">CULTURE.</span>
                <span class="font-display text-2xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-forest-light to-white clip-reveal" style="transition-delay: 0.4s">COMPETITION.</span>
            </div>
        </div>
        <!-- Scene 5: The Final Reveal (8-10s) -->
        <div class="scene flex-col gap-6 md:gap-8 p-6" id="scene-5">
            <h2 class="font-display text-sm md:text-2xl text-text-main tracking-[0.15em] md:tracking-[0.2em] text-center max-w-2xl leading-relaxed">THREE DAYS. ONE CAMPUS.<br>LIMITLESS POSSIBILITIES.</h2>
            <button onclick="window.skipIntro()" class="px-8 py-4 bg-forest text-white font-display text-xs md:text-sm font-bold tracking-widest uppercase rounded shadow-[0_0_20px_rgba(23,63,42,0.5)] active:scale-95 md:hover:scale-105 transition-all touch-manipulation z-10">Enter The Festival</button>
        </div>
        <!-- Skip Button -->
        <button onclick="window.skipIntro()" class="absolute bottom-6 md:bottom-8 right-6 md:right-8 text-[10px] md:text-xs text-text-sec hover:text-white uppercase tracking-widest font-display z-50 transition-colors p-2 touch-manipulation">Skip Intro →</button>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 left-4 right-4 md:top-auto md:left-auto md:bottom-6 md:right-6 z-[600] flex flex-col gap-3 pointer-events-none items-center md:items-end"></div>

    <!-- Modal Root -->
    <div id="modal-root"></div>

    <!-- SPA Application Mount -->
    <div id="app" class="flex-grow flex flex-col h-[100dvh] w-full relative z-20"></div>

    <script>
        /* =========================================================
           1. CORE ARCHITECTURE: IndexedDB FOR IMAGES
        ========================================================= */
        const ImageStore = {
            db: null,
            init() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open('VibranceImageStore', 1);
                    req.onupgradeneeded = (e) => { e.target.result.createObjectStore('images', { keyPath: 'id' }); };
                    req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
                    req.onerror = (e) => { console.error('IndexedDB Error:', e); reject(e); };
                });
            },
            save(id, dataUrl) {
                return new Promise((resolve, reject) => {
                    if (!this.db) return resolve();
                    const tx = this.db.transaction('images', 'readwrite');
                    tx.objectStore('images').put({ id, dataUrl });
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e);
                });
            },
            get(id) {
                return new Promise((resolve) => {
                    if (!this.db) return resolve(null);
                    const tx = this.db.transaction('images', 'readonly');
                    const req = tx.objectStore('images').get(id);
                    req.onsuccess = e => resolve(e.target.result ? e.target.result.dataUrl : null);
                    req.onerror = () => resolve(null);
                });
            },
            delete(id) {
                return new Promise((resolve) => {
                    if (!this.db) return resolve();
                    const tx = this.db.transaction('images', 'readwrite');
                    tx.objectStore('images').delete(id);
                    tx.oncomplete = () => resolve();
                });
            }
        };

        /* =========================================================
           2. CONFIGURATION & LOCALSTORAGE DB
        ========================================================= */
        const CONFIG = { dbKey: 'vibrance2027_data_v3' }; // Bumped DB key to ensure clean state
        
        let STATE = {
            user: JSON.parse(localStorage.getItem('vibrance_user')) || null,
            searchQuery: '',
            categoryFilter: 'All',
            sortBy: 'dateAsc', // Default sorting
            tempImageCache: {} 
        };

        const DB = {
            read() { return JSON.parse(localStorage.getItem(CONFIG.dbKey)); },
            write(data) { localStorage.setItem(CONFIG.dbKey, JSON.stringify(data)); },
            init() {
                if (!localStorage.getItem(CONFIG.dbKey)) {
                    const seedData = { events: [], registrations: [] };
                    
                    const eventsList = [
                        { name: 'HackNova 4.0', cat: 'Technical', date: '2027-10-14T09:00', venue: 'Innovation Hub', cap: 150, fee: 0, img: 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=800&q=80', desc: 'A 36-hour hackathon to build intelligent solutions.', featured: true },
                        { name: 'AI & The Future', cat: 'Workshop', date: '2027-10-15T11:00', venue: 'Auditorium 1', cap: 300, fee: 10, img: 'https://images.unsplash.com/photo-1555255707-c07966088b7b?w=800&q=80', desc: 'Masterclass on Generative AI and Neural Networks.', featured: false },
                        { name: 'Rhythm & Soul', cat: 'Cultural', date: '2027-10-14T19:00', venue: 'Main Stage', cap: 1000, fee: 15, img: 'https://images.unsplash.com/photo-1547153760-18fc86324498?w=800&q=80', desc: 'Inter-college contemporary dance championship.', featured: true },
                        { name: 'Neon Nights Concert', cat: 'Cultural', date: '2027-10-16T21:00', venue: 'Open Ground', cap: 2500, fee: 30, img: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80', desc: 'The ultimate finale concert featuring international artists.', featured: true },
                        { name: 'Valorant Open', cat: 'Gaming', date: '2027-10-14T10:00', venue: 'Esports Arena', cap: 64, fee: 5, img: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&q=80', desc: '5v5 tactical shooter tournament with a massive prize pool.', featured: false }
                    ];

                    eventsList.forEach((e, i) => {
                        seedData.events.push({
                            id: `EVT-${1000 + i}`,
                            name: e.name, category: e.cat, status: 'PUBLISHED',
                            date: e.date, venue: e.venue, capacity: e.cap, fee: e.fee,
                            image: e.img, desc: e.desc, featured: e.featured, hasLocalImg: false
                        });
                    });
                    this.write(seedData);
                }
            },
            getEvents() { return this.read().events; },
            getEvent(id) { return this.read().events.find(e => e.id === id); },
            saveEvent(ev) {
                const data = this.read();
                const idx = data.events.findIndex(e => e.id === ev.id);
                if (idx > -1) data.events[idx] = ev; else data.events.push(ev);
                this.write(data);
            },
            deleteEvent(id) {
                const data = this.read();
                data.events = data.events.filter(e => e.id !== id);
                ImageStore.delete(id);
                this.write(data);
            },
            getRegistrations() { return this.read().registrations; },
            register(payload) {
                const data = this.read();
                const exists = data.registrations.find(r => r.eventId === payload.eventId && r.studentId === payload.studentId && r.status !== 'CANCELLED');
                if (exists) throw new Error("You are already registered for this event.");
                
                const ev = data.events.find(e => e.id === payload.eventId);
                if (!ev) throw new Error("Event not found.");
                
                const current = data.registrations.filter(r => r.eventId === payload.eventId && r.status === 'CONFIRMED').length;
                
                const reg = {
                    ref: 'VIB-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
                    ...payload,
                    status: current >= ev.capacity ? 'WAITLISTED' : 'CONFIRMED',
                    date: new Date().toISOString()
                };
                data.registrations.push(reg);
                this.write(data);
                return reg;
            },
            updateRegStatus(ref, status) {
                const data = this.read();
                const reg = data.registrations.find(r => r.ref === ref);
                if(!reg) return;
                reg.status = status;
                
                if (status === 'CANCELLED') {
                    const ev = data.events.find(e => e.id === reg.eventId);
                    if(ev) {
                        const current = data.registrations.filter(r => r.eventId === reg.eventId && r.status === 'CONFIRMED').length;
                        if(current < ev.capacity) {
                            const waitlisted = data.registrations.filter(r => r.eventId === reg.eventId && r.status === 'WAITLISTED').sort((a,b) => new Date(a.date) - new Date(b.date))[0];
                            if (waitlisted) waitlisted.status = 'CONFIRMED';
                        }
                    }
                }
                this.write(data);
            }
        };

        /* =========================================================
           3. UI UTILITIES & GLOBAL ACTIONS
        ========================================================= */
        const UI = {
            toast(msg, type = 'success') {
                const c = document.getElementById('toast-container');
                const t = document.createElement('div');
                const colors = type === 'error' ? 'bg-card border-crimson text-crimson' : 'bg-card border-forest text-forest';
                t.className = `w-full md:w-auto min-w-[280px] max-w-sm px-4 py-3 md:px-6 md:py-4 rounded-lg border shadow-2xl ${colors} font-body text-xs md:text-sm font-medium animate-entrance pointer-events-auto flex justify-between items-center`;
                t.innerHTML = `<div class="flex items-center gap-3"><span class="text-base">${type === 'error' ? '⚠️' : '✓'}</span> <span>${msg}</span></div>`;
                c.appendChild(t);
                setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(()=>t.remove(), 300); }, 3000);
            },
            formatDate(isoString) {
                if(!isoString) return 'TBA';
                const d = new Date(isoString);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            },
            closeModal() { document.getElementById('modal-root').innerHTML = ''; },
            escapeHTML(str) {
                if(!str) return '';
                return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;','<': '&lt;','>': '&gt;',"'": '&#39;','"': '&quot;'}[tag]));
            },
            toggleMobileMenu() {
                const drawer = document.getElementById('mobile-drawer');
                const overlay = document.getElementById('drawer-overlay');
                if (drawer.classList.contains('-translate-x-full')) {
                    drawer.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    drawer.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            }
        };

        window.exportCSV = () => {
            const regs = DB.getRegistrations();
            if(regs.length === 0) return UI.toast('No registrations to export', 'error');
            const headers = ['TicketRef', 'EventID', 'StudentName', 'StudentEmail', 'Status', 'RegistrationDate'];
            const csv = [headers.join(',')];
            regs.forEach(r => csv.push(`${r.ref},${r.eventId},${r.name},${r.email},${r.status},${r.date}`));
            
            const blob = new Blob([csv.join('\n')], {type: 'text/csv'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Vibrance2027_Registrations.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            UI.toast('Exported to CSV');
        };

        /* =========================================================
           4. CINEMATIC COMPONENTS
        ========================================================= */
        const Components = {
            EventCard: async (ev, context = 'student', staggerIndex = 0) => {
                const regs = DB.getRegistrations().filter(r => r.eventId === ev.id && r.status === 'CONFIRMED').length;
                const seatsLeft = Math.max(0, ev.capacity - regs);
                
                let imgSrc = ev.image;
                if(ev.hasLocalImg) {
                    const localImg = await ImageStore.get(ev.id);
                    if(localImg) imgSrc = localImg;
                } else if (STATE.tempImageCache[ev.id]) {
                    imgSrc = STATE.tempImageCache[ev.id];
                }

                let actionButtons = '';
                if (context === 'student') {
                    actionButtons = `<button onclick="window.openEventModal('${ev.id}')" class="w-full mt-4 py-4 md:py-3 bg-white/5 md:hover:bg-forest text-text-main font-display text-xs tracking-wider uppercase transition-colors rounded border border-border md:hover:border-forest shadow-md touch-manipulation active:bg-forest">Explore Event</button>`;
                } else if (context === 'admin') {
                    actionButtons = `
                        <div class="flex gap-2 mt-4">
                            <a href="#/admin/events/edit?id=${ev.id}" class="flex-1 flex items-center justify-center py-4 md:py-2 bg-white/5 md:hover:bg-forest text-text-main font-display text-xs transition-colors rounded border border-border touch-manipulation">Edit</a>
                            <button onclick="window.duplicateEvent('${ev.id}')" class="px-5 md:px-3 py-4 md:py-2 border border-border bg-white/5 md:hover:bg-white/10 text-white font-display text-xs transition-colors rounded touch-manipulation" title="Duplicate">⎘</button>
                            <button onclick="window.deleteEvent('${ev.id}')" class="px-5 md:px-3 py-4 md:py-2 border border-crimson/30 bg-crimson/10 md:hover:bg-crimson text-crimson md:hover:text-white font-display text-xs transition-colors rounded touch-manipulation">Del</button>
                        </div>
                    `;
                } else if (context === 'ticket') {
                    const ticketStatus = ev.ticketStatus === 'CONFIRMED' ? 'bg-forest text-white' : (ev.ticketStatus === 'WAITLISTED' ? 'bg-yellow-600 text-white' : 'bg-crimson text-white');
                    actionButtons = `
                        <div class="mt-4 pt-4 border-t border-border flex justify-between items-center">
                            <div><div class="text-[10px] text-text-sec uppercase tracking-widest">Reference</div><div class="font-display text-sm text-forest font-bold">${ev.ticketRef}</div></div>
                            <span class="px-3 py-1 rounded text-[10px] font-bold tracking-wider uppercase ${ticketStatus}">${ev.ticketStatus}</span>
                        </div>
                        ${ev.ticketStatus !== 'CANCELLED' ? `<button onclick="window.cancelTicket('${ev.ticketRef}')" class="w-full mt-4 md:mt-3 py-4 md:py-2 border border-crimson/30 text-crimson md:hover:bg-crimson md:hover:text-white active:bg-crimson active:text-white text-xs font-display transition-colors rounded touch-manipulation">Cancel Ticket</button>` : ''}
                    `;
                } else if (context === 'preview') {
                    actionButtons = `<button class="w-full mt-4 py-4 md:py-3 bg-forest text-text-main font-display text-xs tracking-wider uppercase rounded opacity-50 cursor-not-allowed">Explore Event</button>`;
                }

                const statusBadge = ev.status === 'PUBLISHED' ? 
                    `<span class="bg-forest/90 text-white px-2 py-1 rounded text-[10px] font-bold tracking-widest uppercase backdrop-blur-md shadow-lg">Live</span>` : 
                    `<span class="bg-black/90 text-text-sec px-2 py-1 rounded text-[10px] font-bold tracking-widest uppercase backdrop-blur-md border border-border">Draft</span>`;

                return `
                    <div class="cinematic-card group bg-card border border-border rounded-xl flex flex-col relative animate-entrance overflow-hidden" style="animation-delay: ${staggerIndex * 0.05}s">
                        <div class="h-48 md:h-48 cinematic-img-wrap relative bg-secondary">
                            <img src="${imgSrc || 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&q=80'}" alt="${UI.escapeHTML(ev.name)}" onerror="this.src='https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&q=80'" class="w-full h-full object-cover cinematic-img">
                            <div class="absolute inset-0 bg-gradient-to-t from-card via-card/40 to-transparent"></div>
                            <div class="absolute top-4 left-4 right-4 flex justify-between items-start">

            }
        };

        /* =========================================================
           6. CONTROLLERS & ACTION LOGIC
        ========================================================= */
        const App = {
            routes: {
                '/': Views.Landing,
                '/login': Views.Login,
                '/admin': () => App.requireAuth('ADMIN', Views.AdminDash),
                '/admin/events': () => App.requireAuth('ADMIN', Views.AdminEvents),
                '/admin/events/edit': () => App.requireAuth('ADMIN', Views.AdminEditEvent),
                '/student': () => App.requireAuth('STUDENT', Views.StudentDash),
                '/student/discover': () => App.requireAuth('STUDENT', Views.StudentDiscover),
                '/student/tickets': () => App.requireAuth('STUDENT', Views.StudentTickets),
            },
            
            requireAuth: (role, viewFn) => {
                if (!STATE.user || STATE.user.role !== role) {
                    window.location.hash = '/login';
                    return ''; 
                }
                return viewFn(App.getParams());
            },

            getParams: () => {
                const qs = window.location.hash.split('?')[1];
                if (!qs) return {};
                return Object.fromEntries(new URLSearchParams(qs));
            },

            router: async () => {
                const hash = window.location.hash.slice(1) || '/';
                const path = hash.split('?')[0];
                const appDiv = document.getElementById('app');
                const view = App.routes[path] || App.routes['/'];
                
                UI.closeModal();
                
                // Hide mobile menu on route change
                const drawer = document.getElementById('mobile-drawer');
                if (drawer && !drawer.classList.contains('-translate-x-full')) {
                    UI.toggleMobileMenu();
                }

                const htmlContent = await view();
                if(htmlContent) {
                    appDiv.innerHTML = htmlContent;
                    if (path === '/admin/events/edit') window.updatePreview();
                }
            }
        };

        // --- GLOBAL ACTIONS ---
        window.login = (role) => {
            STATE.user = { role: role, id: role === 'STUDENT' ? 'STU-1' : 'ADM-1', name: role === 'STUDENT' ? 'Alex Mercer' : 'System Admin', email: role === 'STUDENT' ? 'alex@vibrance.edu' : 'admin@vibrance.edu' };
            localStorage.setItem('vibrance_user', JSON.stringify(STATE.user));
            window.location.hash = role === 'ADMIN' ? '/admin' : '/student';
            UI.toast(`Authenticated as ${role}`);
        };

        window.logout = () => {
            STATE.user = null;
            localStorage.removeItem('vibrance_user');
            window.location.hash = '/';
            UI.toast('Logged out safely');
        };

        // --- INTRO ACTIONS ---
        window.playIntro = (force = false) => {
            if(sessionStorage.getItem('vibrance_intro_played') && !force) return;
            sessionStorage.setItem('vibrance_intro_played', 'true');
            
            const intro = document.getElementById('cinematic-intro');
            intro.classList.remove('hidden');
            intro.classList.remove('opacity-0');
            
            const scenes = [
                document.getElementById('scene-1'), document.getElementById('scene-2'),
                document.getElementById('scene-3'), document.getElementById('scene-4'),
                document.getElementById('scene-5')
            ];
            scenes.forEach(s => s.classList.remove('active'));

            STATE.introTimers = [
                setTimeout(() => scenes[0].classList.add('active'), 100),
                setTimeout(() => { scenes[0].classList.remove('active'); scenes[1].classList.add('active'); }, 2000),
                setTimeout(() => { scenes[1].classList.remove('active'); scenes[2].classList.add('active'); }, 4000),
                setTimeout(() => { scenes[2].classList.remove('active'); scenes[3].classList.add('active'); }, 6000),
                setTimeout(() => { scenes[3].classList.remove('active'); scenes[4].classList.add('active'); }, 8500)
            ];
        };

        window.skipIntro = () => {
            if(STATE.introTimers) STATE.introTimers.forEach(t => clearTimeout(t));
            const intro = document.getElementById('cinematic-intro');
            intro.classList.add('opacity-0');
            setTimeout(() => {
                intro.classList.add('hidden');
                intro.classList.remove('opacity-0');
            }, 800);
        };

        // --- ADMIN EVENT ACTIONS ---
        window.updatePreview = async () => {
            const container = document.getElementById('live-preview-container');
            if (!container) return;
            
            const evId = document.getElementById('ev-id').value;
            let previewImg = 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&q=80';
            
            if (STATE.tempImageCache[evId]) previewImg = STATE.tempImageCache[evId];
            else if(document.getElementById('ev-img-url').value) previewImg = document.getElementById('ev-img-url').value;

            const ev = {
                id: evId || 'EVT-PREV', name: document.getElementById('ev-name').value || 'Event Name',
                category: document.getElementById('ev-cat').value, status: document.getElementById('ev-status').value,
                date: document.getElementById('ev-date').value || new Date().toISOString(),
                venue: document.getElementById('ev-venue').value || 'Location',
                capacity: parseInt(document.getElementById('ev-cap').value) || 100, fee: parseInt(document.getElementById('ev-fee').value) || 0,
                image: previewImg, desc: document.getElementById('ev-desc').value || 'Description...', hasLocalImg: false 
            };
            
            container.innerHTML = await Components.EventCard(ev, 'preview', 0);
        };

        window.handleImageUpload = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 5 * 1024 * 1024) return UI.toast('File too large (Max 5MB)', 'error');
            if(!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return UI.toast('Invalid format. Use JPG/PNG/WEBP', 'error');

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    let width = img.width, height = img.height;
                    
                    if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const evId = document.getElementById('ev-id').value || 'NEW';
                    STATE.tempImageCache[evId] = dataUrl;
                    document.getElementById('ev-img-url').value = '';
                    
                    document.getElementById('upload-preview').src = dataUrl;
                    document.getElementById('upload-preview').classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                    window.updatePreview();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.handleImageUrlInput = () => {
            const evId = document.getElementById('ev-id').value || 'NEW';
            delete STATE.tempImageCache[evId];
            document.getElementById('upload-preview').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
            document.getElementById('ev-file').value = '';
            window.updatePreview();
        };

        window.saveEvent = async (e, isNew) => {
            e.preventDefault();
            try {
                const baseId = document.getElementById('ev-id').value;
                const finalId = baseId || `EVT-${Math.floor(Math.random()*10000) + Date.now().toString().slice(-4)}`;
                const name = document.getElementById('ev-name').value.trim();
                const date = document.getElementById('ev-date').value;
                const capacity = parseInt(document.getElementById('ev-cap').value);
                const desc = document.getElementById('ev-desc').value.trim();
                
                if(!name || !date || capacity < 1 || !desc) throw new Error("Please complete all required fields correctly.");

                const cacheId = baseId || 'NEW';
                let hasLocalImg = false;
                let finalImageStr = document.getElementById('ev-img-url').value;

                if (STATE.tempImageCache[cacheId]) {
                    await ImageStore.save(finalId, STATE.tempImageCache[cacheId]);
                    hasLocalImg = true;
                    finalImageStr = ''; 
                    delete STATE.tempImageCache[cacheId];
                } else if (baseId) {
                    const existingEv = DB.getEvent(baseId);
                    if (existingEv && existingEv.hasLocalImg && !finalImageStr) hasLocalImg = true;
                }

                const ev = {
                    id: finalId, name: name, category: document.getElementById('ev-cat').value, status: document.getElementById('ev-status').value,
                    date: date, venue: document.getElementById('ev-venue').value, capacity: capacity, fee: parseInt(document.getElementById('ev-fee').value) || 0,
                    image: finalImageStr, desc: desc, hasLocalImg: hasLocalImg
                };
                
                DB.saveEvent(ev);
                UI.toast(`Event ${isNew ? 'created' : 'updated'} successfully`);
                window.location.hash = '/admin/events';
            } catch(err) { UI.toast(err.message || 'Error saving event', 'error'); }
        };

        window.deleteEvent = async (id) => {
            if(confirm('Are you sure you want to delete this event? This will also orphan any registrations.')) {
                DB.deleteEvent(id);
                UI.toast('Event removed');
                App.router(); 
            }
        };

        window.duplicateEvent = async (id) => {
            const ev = DB.getEvent(id);
            if(!ev) return;
            const newId = `EVT-${Math.floor(Math.random()*10000) + Date.now().toString().slice(-4)}`;
            const newEv = { ...ev, id: newId, name: ev.name + ' (Copy)', status: 'DRAFT' };
            if (ev.hasLocalImg) {
                const imgData = await ImageStore.get(ev.id);
                if(imgData) await ImageStore.save(newId, imgData);
            }
            DB.saveEvent(newEv);
            UI.toast('Event duplicated as Draft');
            App.router();
        }

        // --- FILTERING AND SORTING ---

        const applyFiltersAndSort = (eventsArray) => {
            let filtered = [...eventsArray];
            
            // Filter Category
            if (STATE.categoryFilter && STATE.categoryFilter !== 'All Categories') {
                filtered = filtered.filter(e => e.category === STATE.categoryFilter);
            }
            // Filter Search
            if (STATE.searchQuery) {
                const q = STATE.searchQuery.toLowerCase();
                filtered = filtered.filter(e => e.name.toLowerCase().includes(q) || e.desc.toLowerCase().includes(q));
            }

            // Sort
            filtered.sort((a, b) => {
                switch(STATE.sortBy) {
                    case 'dateAsc': return new Date(a.date) - new Date(b.date);
                    case 'dateDesc': return new Date(b.date) - new Date(a.date);
                    case 'priceAsc': return a.fee - b.fee;
                    case 'availDesc': 
                        const aRegs = DB.getRegistrations().filter(r => r.eventId === a.id && r.status === 'CONFIRMED').length;
                        const bRegs = DB.getRegistrations().filter(r => r.eventId === b.id && r.status === 'CONFIRMED').length;
                        return (b.capacity - bRegs) - (a.capacity - aRegs);
                    default: return 0;
                }
            });
            return filtered;
        };

        window.filterAdminEvents = async () => {
            const searchEl = document.getElementById('search-input');
            const catEl = document.getElementById('cat-filter');
            const sortEl = document.getElementById('sort-filter');
            if(!searchEl || !catEl || !sortEl) return;
            
            STATE.searchQuery = searchEl.value;
            STATE.categoryFilter = catEl.value;
            STATE.sortBy = sortEl.value;
            
            const grid = document.getElementById('admin-events-grid');
            if(!grid) return;
            
            let events = applyFiltersAndSort(DB.getEvents());
            const cardsPromises = events.map((ev, i) => Components.EventCard(ev, 'admin', i));
            const cardsHtmlArr = await Promise.all(cardsPromises);
            grid.innerHTML = cardsHtmlArr.length ? cardsHtmlArr.join('') : '<div class="col-span-full text-center text-text-sec py-20 bg-card border border-border border-dashed rounded-xl text-sm">No events found matching criteria.</div>';
        };

        window.clearAdminFilters = () => {
            document.getElementById('search-input').value = '';
            document.getElementById('cat-filter').value = 'All Categories';
            document.getElementById('sort-filter').value = 'dateAsc';
            window.filterAdminEvents();
        };

        window.filterEvents = async () => {
            const searchEl = document.getElementById('search-input');
            const catEl = document.getElementById('cat-filter');
            const sortEl = document.getElementById('sort-filter');
            if(!searchEl || !catEl || !sortEl) return;
            
            STATE.searchQuery = searchEl.value;
            STATE.categoryFilter = catEl.value;
            STATE.sortBy = sortEl.value;
            
            const grid = document.getElementById('events-grid');
            if(!grid) return;
            
            let events = DB.getEvents().filter(e => e.status === 'PUBLISHED');
            events = applyFiltersAndSort(events);

            const cardsPromises = events.map((ev, i) => Components.EventCard(ev, 'student', i));
            const cardsHtmlArr = await Promise.all(cardsPromises);
            grid.innerHTML = cardsHtmlArr.length ? cardsHtmlArr.join('') : '<div class="col-span-full text-center text-text-sec py-20 animate-entrance bg-card border border-border border-dashed rounded-xl text-sm">No events found matching criteria.</div>';
        };

        window.clearFilters = () => {
            document.getElementById('search-input').value = '';
            document.getElementById('cat-filter').value = 'All Categories';
            document.getElementById('sort-filter').value = 'dateAsc';
            window.filterEvents();
        };

        // --- STUDENT REGISTRATION ACTIONS ---
        window.openEventModal = async (id) => {
            const ev = DB.getEvent(id);
            if(ev) document.getElementById('modal-root').innerHTML = await Views.EventModal(ev);
        };

        window.openRegModal = (id) => {
            const ev = DB.getEvent(id);
            if(ev) document.getElementById('modal-root').innerHTML = Views.RegModal(ev);
        };

        window.submitRegistration = (e, evId) => {
            e.preventDefault();
            try {
                const reg = DB.register({ eventId: evId, studentId: STATE.user.id, name: STATE.user.name, email: STATE.user.email });
                UI.closeModal();
                UI.toast(reg.status === 'WAITLISTED' ? 'Added to waitlist!' : 'Ticket Confirmed!');
                setTimeout(() => { window.location.hash = '/student/tickets'; }, 800);
            } catch (err) { UI.toast(err.message, 'error'); }
        };

        window.cancelTicket = (ref) => {
            if(confirm('Cancel this registration? This cannot be undone and your spot will go to the waitlist.')) {
                DB.updateRegStatus(ref, 'CANCELLED');
                UI.toast('Ticket Cancelled');
                App.router();
            }
        };

        // Drag and Drop global listeners for upload zone
        document.addEventListener('dragover', (e) => {
            const dropzone = document.getElementById('upload-dropzone');
            if (dropzone && dropzone.contains(e.target)) { e.preventDefault(); dropzone.classList.add('dragover'); }
        });
        document.addEventListener('dragleave', (e) => {
            const dropzone = document.getElementById('upload-dropzone');
            if (dropzone) dropzone.classList.remove('dragover');
        });
        document.addEventListener('drop', (e) => {
            const dropzone = document.getElementById('upload-dropzone');
            if (dropzone && dropzone.contains(e.target)) {
                e.preventDefault(); dropzone.classList.remove('dragover');
                if (e.dataTransfer.files.length) {
                    document.getElementById('ev-file').files = e.dataTransfer.files;
                    window.handleImageUpload({ target: { files: e.dataTransfer.files } });
                }
            }
        });

        // App Boot
        window.addEventListener('hashchange', App.router);
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await ImageStore.init();
                DB.init();
                if (window.location.hash === '' || window.location.hash === '#/') window.playIntro();
                await App.router();
            } catch (err) {
                console.error("Boot Error:", err);
                alert("Critical failure initializing database. Please clear site data and refresh.");
            }
        });
    </script>
</body>
</html>
